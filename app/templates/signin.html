{% extends "base.html" %}
{% block title %}Sign in — Math Circle Home{% endblock %}
{% block body %}
<section class="card" style="max-width: 520px; margin: 0 auto;">
  <h1>Sign in</h1>
  {% if error %}
    <p style="color:#c0392b;">{{ error }}</p>
  {% endif %}
  <form method="post" action="/auth/sign-in" class="stack">
    <div>
      <label>Family email</label>
      <input type="email" name="email" required placeholder="you@example.com" maxlength="160" autofocus>
    </div>
    <div>
      <label>Password</label>
      <input type="password" name="password" required minlength="8" maxlength="200">
    </div>
    <div>
      <button class="btn" type="submit">Sign in</button>
    </div>
  </form>
  <p class="muted" style="margin-top: 1rem">
    <a href="/auth/forgot-password">Forgot your password?</a>
  </p>
  <p class="muted">
    Don't have access yet? <a href="/request-access">Request access for your kids →</a>
  </p>
</section>
{% endblock %}
